name: "Build for Crostini"

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt update -y
          sudo apt install -y \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libwpewebkit-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Prepare Flutter dependencies
        shell: bash
        run: |
          flutter pub get

          # Generate settings search index (.g.dart) — gitignored, regenerated per build.
          dart run tool/generate_search_index.dart

      - name: Build Linux app
        run: flutter build linux --release

      - name: Prepare app bundle
        shell: bash
        run: |
          BUNDLE_DIR=$(find build -type d -name 'bundle' | head -n 1)

          # No longer necessary
          #ZSTD_LIB=$(find build -type f -name 'libzstandard_linux.so' | head -n 1)
          #cp -v $ZSTD_LIB $BUNDLE_DIR/lib/$(basename $ZSTD_LIB)
          #chmod 644 $BUNDLE_DIR/lib/$(basename $ZSTD_LIB)

          RPATH=$(patchelf --print-rpath $BUNDLE_DIR/lib/libzstandard_linux_plugin.so)
          patchelf --set-rpath "\$ORIGIN:$RPATH" $BUNDLE_DIR/lib/libzstandard_linux_plugin.so

          # portable.marker makes the raw package portable:
          # All data is stored in the otzaria_data folder next to the executable
          # See lib/core/app_paths.dart - isPortable
          touch $BUNDLE_DIR/portable.marker

          tar -czf otzaria-linux-app.tar.gz -C $BUNDLE_DIR .

      - name: Prepare full bundle
        if: false
        shell: bash
        run: |
          LIBRARY=library_db
          FULL_DIR=otzaria-linux-full
          BOOKS_DIR=otzaria_library
          BUNDLE_DIR=$(find build -type d -name 'bundle' | head -n 1)

          mkdir -p $LIBRARY
          curl -Lf https://github.com/Otzaria/SeforimLibrary/releases/latest/download/seforim.db.zst -o $LIBRARY/seforim.db.zst
          curl -Lf https://github.com/Otzaria/otzar-HB_catalog/releases/latest/download/otzar-HB_catalog.db.zst -o $LIBRARY/otzar-HB_catalog.db.zst
          curl -Lf https://github.com/Otzaria/otzaria-library/releases/latest/download/talmud_bavli_latest.tar.zst -o $LIBRARY/talmud_bavli_latest.tar.zst
          curl -Lf https://github.com/Otzaria/SeforimMagicIndexer/releases/latest/download/lexical.db -o $LIBRARY/lexical.db

          rm -rf FULL_DIR
          cp -rf $BUNDLE_DIR $FULL_DIR
          mkdir -p $FULL_DIR/$BOOKS_DIR

          zstd -d -c --long=31 --memory=2048MB $LIBRARY/seforim.db.zst > $FULL_DIR/$BOOKS_DIR/seforim.db
          zstd -d -c --long=31 --memory=2048MB $LIBRARY/otzar-HB_catalog.db.zst > $FULL_DIR/$BOOKS_DIR/otzar-HB_catalog.db
          zstd -d -c --long=31 --memory=2048MB $LIBRARY/talmud_bavli_latest.tar.zst | tar -xf - -C $FULL_DIR/$BOOKS_DIR

          # The related search dictionary (lexical.db) is not compressed, copy it as is next to seforim.db.
          cp $LIBRARY/lexical.db $FULL_DIR/$BOOKS_DIR/lexical.db

          # The FULL package is not portable (user data remains in the user folder)
          # Remove the marker file from the linux build
          rm -f "$FULL_DIR/portable.marker"

          # A marker file that signals to the application that the folder is a bundled library of the full package
          # See lib/core/app_paths.dart - _detectBundledLibraryPath.
          touch "$FULL_DIR/$BOOKS_DIR/.otzaria_bundled_library"

          tar -czf otzaria-linux-full.tar.gz -C $FULL_DIR .

      - name: Build Linux DEB package
        if: false
        shell: bash
        run: |
          dart pub global activate fastforge
          fastforge release --name=production --jobs=release-linux-deb

      - name: Prepare DEB package
        id: find_packages
        shell: bash
        run: |
          if [ -d dist ]; then
            DEB_FILE=$(find dist -type f -name '*-linux.deb' | head -n 1)
            if [ -n "$DEB_FILE" ]; then
              echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
              echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload linux app bundle
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-linux-app
          path: otzaria-linux-app.tar.gz
          archive: false

      - name: Upload linux full bundle
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-linux-full
          path: otzaria-linux-full.tar.gz
          archive: false

      - name: Upload linux deb package
        if: steps.find_packages.outputs.deb_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-linux-deb
          path: ${{ steps.find_packages.outputs.deb_file }}
          archive: false
