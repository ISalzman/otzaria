name: Flutter Tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Analyze & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # שימוש ב-channel stable + cache, אחיד עם build-and-announce.yml
      # (לא ננעל גרסה כדי שלא נצטרך לעדכן בשני מקומות).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # חילול אינדקס חיפוש בהגדרות. ה-.g.dart נדחף לרפו, אבל הסקריפט הזה
      # יוודא שהוא עדכני בכל הרצה (אם searchEntries השתנו במהלך ה-PR).
      - name: Generate settings search index
        run: dart run tool/generate_search_index.dart

      # ה-trinity של CLAUDE.md: analyze + test (פורמט נבדק locally בlint).
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
