name: Reply on forum when issue closes

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  reply:
    if: contains(github.event.issue.labels.*.name, 'from-forum')
    runs-on: ubuntu-latest
    steps:
      - name: Post reply to linked forum post
        env:
          FORUM_TOKEN: ${{ secrets.FORUM_BOT_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          FORUM=https://otzaria.org/forum

          pid=$(grep -oP 'otzaria\.org/forum/post/\K\d+' <<< "$ISSUE_BODY" | head -1 || true)
          if [ -z "$pid" ]; then
            echo "No forum post link in issue body — skipping."
            exit 0
          fi

          post=$(curl -sf "$FORUM/api/v3/posts/$pid") || { echo "Post $pid not found — skipping."; exit 0; }
          tid=$(jq -r '.response.tid // empty' <<< "$post")
          uid=$(jq -r '.response.uid // empty' <<< "$post")
          if [ -z "$tid" ]; then
            echo "Could not resolve topic for post $pid — skipping."
            exit 0
          fi

          mention=""
          if [ -n "$uid" ]; then
            slug=$(curl -sf "$FORUM/api/user/uid/$uid" | jq -r '.userslug // empty' || true)
            [ -n "$slug" ] && mention="@$slug "
          fi

          content="${mention}נסגרה כעת בעיה בגיטהאב המקושרת לפוסט זה. לפרטים נוספים: $ISSUE_URL"
          body=$(jq -n --arg content "$content" --argjson toPid "$pid" '{content: $content, toPid: $toPid}')

          curl -sf -X POST "$FORUM/api/v3/topics/$tid" \
            -H "Authorization: Bearer $FORUM_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" > /dev/null
          echo "Replied on topic $tid (post $pid) for issue #$ISSUE_NUMBER."
