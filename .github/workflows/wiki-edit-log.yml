name: Wiki edit log

# אירוע gollum נורה על כל יצירה/עריכה של דף בוויקי.
# ה-workflow מתעד את השינוי כתגובה ב-issue קבוע ("יומן עריכות ויקי") —
# כל מי שרשום (Subscribe) ל-issue מקבל התראת GitHub על כל עריכה.
on: gollum

permissions:
  issues: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pages = context.payload.pages || [];
            if (pages.length === 0) return;

            const editor = context.payload.sender?.login ?? 'לא ידוע';
            const lines = pages.map((p) => {
              const action = p.action === 'created' ? 'נוצר' : 'נערך';
              const compare = `https://github.com/${owner}/${repo}/wiki/_compare/${p.sha}%5E...${p.sha}`;
              return `- **[${p.title}](${p.html_url})** ${action} על ידי @${editor} — [השוואת שינויים](${compare}) · [היסטוריית הדף](${p.html_url}/_history)`;
            });

            const LABEL = 'wiki-log';
            try {
              await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: '0e8a16', description: 'יומן אוטומטי של עריכות הוויקי' });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = התווית כבר קיימת
            }

            const { data: existing } = await github.rest.issues.listForRepo({ owner, repo, labels: LABEL, state: 'open', per_page: 1 });
            let issueNumber = existing[0]?.number;
            if (!issueNumber) {
              const { data: created } = await github.rest.issues.create({
                owner, repo,
                title: 'יומן עריכות ויקי',
                labels: [LABEL],
                body: 'issue אוטומטי: כל עריכה בוויקי מתועדת כאן כתגובה.\n\nכדי לקבל התראה על כל עריכה — לחצו **Subscribe** בסרגל הצד. ביטול/שחזור עריכה: דרך "היסטוריית הדף" שבכל תגובה.',
              });
              issueNumber = created.number;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: lines.join('\n') });
